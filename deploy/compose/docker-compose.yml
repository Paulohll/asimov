services:
  opencode:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    restart: always
    working_dir: /affiliateSO
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - workspace:/affiliateSO
      - opencode_data:/root/.local/share/opencode
      - opencode_config:/root/.config/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - ${CORS_ORIGIN:-*}
      - /affiliateSO

  opencode-paulo.horna:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    container_name: opencode-paulo.horna
    restart: unless-stopped
    working_dir: /affiliateSO
    ports:
      - "127.0.0.1:4001:4000"
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - /opt/asimov/workspaces/paulo.horna/affiliateSO:/affiliateSO
      - opencode_config_paulo_horna:/root/.config/opencode
      - opencode_data_paulo_horna:/root/.local/share/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - "https://code.euroaffiliati.com"
      - /affiliateSO
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"


  opencode-user2:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    container_name: opencode-user2
    restart: unless-stopped
    working_dir: /affiliateSO
    ports:
      - "127.0.0.1:4002:4000"
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - /opt/asimov/workspaces/user2/affiliateSO:/affiliateSO
      - opencode_config_user2:/root/.config/opencode
      - opencode_data_user2:/root/.local/share/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - "https://code.euroaffiliati.com"
      - /affiliateSO
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"


  opencode-user3:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    container_name: opencode-user3
    restart: unless-stopped
    working_dir: /affiliateSO
    ports:
      - "127.0.0.1:4003:4000"
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - /opt/asimov/workspaces/user3/affiliateSO:/affiliateSO
      - opencode_config_user3:/root/.config/opencode
      - opencode_data_user3:/root/.local/share/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - "https://code.euroaffiliati.com"
      - /affiliateSO
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"

volumes:
  workspace:
  opencode_data:
  opencode_config:
  opencode_config_paulo_horna:
  opencode_data_paulo_horna:
  opencode_config_user2:
  opencode_data_user2:
  opencode_config_user3:
  opencode_data_user3:
