# Per-user OpenCode containers behind the nginx + auth_server.py gateway.
#
# nginx (deploy/nginx/code.euroaffiliati.com.conf) validates the session
# cookie via auth_server.py (:4005) and proxies to 127.0.0.1:<port> for the
# authenticated user. None of these services should ever bind 0.0.0.0 —
# they must only be reachable through the authenticated nginx path.
#
# To add a user: run scripts/opencode_user_manager.sh, which appends a new
# service block here (copy the x-opencode-user template below) and a matching
# entry to auth/users.json.

x-opencode-user: &opencode-user
  image: ${DOCKER_IMAGE:-europe-west1-docker.pkg.dev/affiliatteaccess/asimov/opencode}:${DOCKER_TAG:-latest}
  restart: unless-stopped
  working_dir: /affiliateSO
  environment:
    OPENCODE_DISABLE_AUTOUPDATE: "true"
    GEMINI_API_KEY: ${GEMINI_API_KEY}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
  command:
    - web
    - --hostname
    - "0.0.0.0"
    - --port
    - "4000"
    - --cors
    - ${CORS_ORIGIN:-https://code.euroaffiliati.com}
    - /affiliateSO
  deploy:
    resources:
      limits:
        memory: 1536M
        cpus: "1.0"

services:
  # Legacy single-instance service, not part of the per-user auth flow.
  # nginx never proxies to it directly; it is only reachable if something
  # connects to 127.0.0.1:4000 on the host itself. Kept bound to loopback
  # so it cannot be reached from outside even if a firewall rule is left
  # open. Consider removing entirely once confirmed unused.
  opencode:
    <<: *opencode-user
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - workspace:/affiliateSO
      - opencode_data:/root/.local/share/opencode
      - opencode_config:/root/.config/opencode

  opencode-paulo.horna:
    <<: *opencode-user
    container_name: opencode-paulo.horna
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - /opt/asimov/workspaces/paulo.horna/affiliateSO:/affiliateSO
      - opencode_config_paulo_horna:/root/.config/opencode
      - opencode_data_paulo_horna:/root/.local/share/opencode




  opencode-riccardo.salis:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    container_name: opencode-riccardo.salis
    restart: unless-stopped
    working_dir: /affiliateSO
    ports:
      - "127.0.0.1:4002:4000"
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - /opt/asimov/workspaces/riccardo.salis/affiliateSO:/affiliateSO
      - opencode_config_riccardo.salis:/root/.config/opencode
      - opencode_data_riccardo.salis:/root/.local/share/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - "https://code.euroaffiliati.com"
      - /affiliateSO
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"


  opencode-fran.digrande:
    image: ${DOCKER_IMAGE:-opencode-custom}:${DOCKER_TAG:-latest}
    container_name: opencode-fran.digrande
    restart: unless-stopped
    working_dir: /affiliateSO
    ports:
      - "127.0.0.1:4003:4000"
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - /opt/asimov/workspaces/fran.digrande/affiliateSO:/affiliateSO
      - opencode_config_fran.digrande:/root/.config/opencode
      - opencode_data_fran.digrande:/root/.local/share/opencode
    command:
      - web
      - --hostname
      - "0.0.0.0"
      - --port
      - "4000"
      - --cors
      - "https://code.euroaffiliati.com"
      - /affiliateSO
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"

volumes:
  workspace:
  opencode_data:
  opencode_config:
  opencode_config_paulo_horna:
  opencode_data_paulo_horna:
  opencode_config_riccardo.salis:
  opencode_data_riccardo.salis:
  opencode_config_fran.digrande:
  opencode_data_fran.digrande:
