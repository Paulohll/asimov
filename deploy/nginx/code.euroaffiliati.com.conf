server {
    listen 80;
    listen [::]:80;
    server_name code.euroaffiliati.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name code.euroaffiliati.com;

    ssl_certificate     /etc/letsencrypt/live/code.euroaffiliati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.euroaffiliati.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Auth validation internal endpoint
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:4005/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Custom login & logout endpoints
    location /login {
        proxy_pass http://127.0.0.1:4005/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://127.0.0.1:4005/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Onboarding self-service (publico, sin auth_request; el POST provisiona el workspace)
    location /onboard {
        proxy_pass http://127.0.0.1:4005/onboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Main OpenCode App (Protected by Custom Auth, routed dynamically per-user)
    location / {
        auth_request /_auth_check;
        auth_request_set $upstream_port $upstream_http_x_upstream_port;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:$upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }
}
